; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Settings shared by all firmware environments
[firmware]
; Pinned to the 6.x platform (Arduino-ESP32 core 2.0.x, ESP-IDF 4.4). Newer
; platform releases switch to Arduino core 3.x / ESP-IDF 5, where APIs such as
; esp_task_wdt_init() have different signatures.
platform = espressif32@~6.13.0
framework = arduino
monitor_speed = 115200
board = esp32dev
board_build.f_cpu = 240000000L
lib_deps =
	; The library is no longer resolvable as e-radionicacom/InkplateLibrary in the
	; PlatformIO registry, so it is fetched from Soldered's GitHub repository.
	https://github.com/SolderedElectronics/Inkplate-Arduino-library.git#10.2.2
	bblanchon/ArduinoJson@^7.4.1
	tzapu/WiFiManager@^2.0.17
build_unflags =
	-DARDUINO_ESP32
	-DARDUINO_ESP32_DEV
build_flags =
	-DBOARD_HAS_PSRAM
	-mfix-esp32-psram-cache-issue

[debug]
extends = firmware
monitor_filters = esp32_exception_decoder
build_type = debug
build_flags =
	${firmware.build_flags}
	-DLOG_LEVEL=5
	-DCORE_DEBUG_LEVEL=4

[release]
extends = firmware
build_type = release
build_flags =
	${firmware.build_flags}
	-DLOG_LEVEL=4
	-DCORE_DEBUG_LEVEL=0

[env:debug_inkplate10v2]
extends = debug
build_flags =
	${debug.build_flags}
	-DARDUINO_INKPLATE10V2

[env:release_inkplate10v2]
extends = release
build_flags =
	${release.build_flags}
	-DARDUINO_INKPLATE10V2

[env:debug_inkplate5v2]
extends = debug
build_flags =
	${debug.build_flags}
	-DARDUINO_INKPLATE5V2

[env:release_inkplate5v2]
extends = release
build_flags =
	${release.build_flags}
	-DARDUINO_INKPLATE5V2

; Host-side unit tests for the helpers in src/Utils/utils.cpp: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<Utils/utils.cpp>
build_flags = -std=gnu++17 -Wall -Wextra -Isrc
